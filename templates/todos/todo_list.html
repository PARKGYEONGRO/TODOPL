{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col md:flex-row h-full">

    <!-- [좌측] 미니 캘린더 및 태그 필터 (PC 전용 / 모바일 캘린더 탭) -->
    <aside class="w-full md:w-80 border-r border-gray-200 p-6 flex flex-col justify-between">
        <div>
            <!-- 월간 네비게이션 -->
            <div class="flex justify-between items-center mb-6">
                <button class="text-gray-400 hover:text-black"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="font-bold text-lg">2026.07</span>
                <button class="text-gray-400 hover:text-black"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <!-- 미니 달력 그리드 -->
            <div class="grid grid-cols-7 gap-2 text-center text-sm font-medium mb-8">
                <span class="text-red-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                <!-- 날짜 행 예시 -->
                <span class="text-gray-300">28</span><span class="text-gray-300">29</span><span class="text-gray-300">30</span>
                <span>1</span><span>2</span><span>3</span><span>4</span>
                <span class="text-red-500">5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span>
                <span class="text-red-500">12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span>
                <span class="text-red-500">19</span><span>20</span><span>21</span>
                <!-- 오늘 날짜 선택 (22) -->
                <span class="bg-black text-white rounded-full w-7 h-7 flex items-center justify-center mx-auto font-bold">22</span>
                <span>23</span><span>24</span><span>25</span>
                <span class="text-red-500">26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span><span class="text-gray-300">1</span>
            </div>
        </div>

        <!-- 태그 필터 버튼 -->
        <div class="border-t border-gray-100 pt-4">
            <p class="text-xs text-gray-400 font-semibold mb-3">태그 필터</p>
            <div class="flex flex-wrap gap-2">
                <button class="bg-black text-white px-3 py-1 rounded text-xs font-medium">전체</button>
                <button class="bg-gray-100 text-gray-600 px-3 py-1 rounded text-xs font-medium hover:bg-gray-200">업무</button>
                <button class="bg-gray-100 text-gray-600 px-3 py-1 rounded text-xs font-medium hover:bg-gray-200">개인</button>
                <button class="bg-gray-100 text-gray-600 px-3 py-1 rounded text-xs font-medium hover:bg-gray-200">건강</button>
                <button class="bg-gray-100 text-gray-600 px-3 py-1 rounded text-xs font-medium hover:bg-gray-200">공부</button>
                <button class="bg-gray-100 text-gray-600 px-3 py-1 rounded text-xs font-medium hover:bg-gray-200">기타</button>
            </div>
        </div>
    </aside>

    <!-- [중앙] 메인 To-Do 리스트 영역 -->
    <section class="flex-1 p-6 md:p-8">
        <!-- 헤더 (날짜 및 버튼) -->
        <div class="flex justify-between items-start mb-6">
            <div>
                <div class="flex items-center gap-3">
                    <span class="text-4xl font-extrabold">22</span>
                    <span class="bg-red-500 text-white text-xs px-2 py-0.5 rounded font-bold">오늘</span>
                </div>
                <p class="text-gray-400 text-sm mt-1">2026년 7월 수요일</p>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs text-gray-400">5/5 완료</span>
                <button onclick="openModal()" class="bg-black text-white px-4 py-2 rounded text-sm font-bold hover:bg-gray-800 transition">
                    + 할 일 추가
                </button>
            </div>
        </div>

        <!-- To-Do 항목 리스트 -->
        <div class="space-y-3">
            <!-- 항목 1 (완료 상태 예시) -->
            <div class="flex items-center justify-between p-3 border-b border-gray-100 hover:bg-gray-50 rounded group">
                <div class="flex items-center gap-3">
                    <div class="w-1 h-5 bg-red-500 rounded-full"></div> <!-- 우선순위 레벨 바 -->
                    <input type="checkbox" checked class="w-5 h-5 accent-black rounded cursor-pointer">
                    <span class="line-through text-gray-400 font-medium">주간 보고서 작성</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="border border-gray-200 text-gray-500 text-xs px-2 py-0.5 rounded">업무</span>
                    <span class="text-red-500 font-bold text-xs">H</span>
                    <button class="text-gray-300 hover:text-red-500"><i class="fa-regular fa-trash-can"></i></button>
                </div>
            </div>

            <!-- 항목 2 -->
            <div class="flex items-center justify-between p-3 border-b border-gray-100 hover:bg-gray-50 rounded group">
                <div class="flex items-center gap-3">
                    <div class="w-1 h-5 bg-amber-500 rounded-full"></div>
                    <input type="checkbox" checked class="w-5 h-5 accent-black rounded cursor-pointer">
                    <span class="line-through text-gray-400 font-medium">팀 미팅 준비</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="border border-gray-200 text-gray-500 text-xs px-2 py-0.5 rounded">업무</span>
                    <span class="text-amber-500 font-bold text-xs">M</span>
                    <button class="text-gray-300 hover:text-red-500"><i class="fa-regular fa-trash-can"></i></button>
                </div>
            </div>

            <!-- 항목 3 -->
            <div class="flex items-center justify-between p-3 border-b border-gray-100 hover:bg-gray-50 rounded group">
                <div class="flex items-center gap-3">
                    <div class="w-1 h-5 bg-gray-400 rounded-full"></div>
                    <input type="checkbox" checked class="w-5 h-5 accent-black rounded cursor-pointer">
                    <span class="line-through text-gray-400 font-medium">헬스장 1시간</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="border border-gray-200 text-gray-500 text-xs px-2 py-0.5 rounded">건강</span>
                    <span class="text-gray-400 font-bold text-xs">L</span>
                    <button class="text-gray-300 hover:text-red-500"><i class="fa-regular fa-trash-can"></i></button>
                </div>
            </div>
        </div>
    </section>

    <!-- [우측] 통계 대시보드 (PC 전용 / 모바일 통계 탭) -->
    <aside class="hidden lg:block w-80 border-l border-gray-200 p-6 bg-gray-50/50">
        <h3 class="text-sm font-bold text-gray-400 mb-6">통계</h3>

        <!-- 카드 수치 -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-gray-100 p-4 rounded-lg">
                <span class="text-xs text-gray-400 font-semibold">전체</span>
                <p class="text-2xl font-extrabold mt-1">7</p>
            </div>
            <div class="bg-gray-100 p-4 rounded-lg">
                <span class="text-xs text-gray-400 font-semibold">완료</span>
                <p class="text-2xl font-extrabold text-red-500 mt-1">7</p>
            </div>
        </div>

        <!-- 진행률 프로그레스 바 -->
        <div class="mb-8">
            <div class="flex justify-between text-xs font-bold mb-2">
                <span>완료율</span>
                <span>100%</span>
            </div>
            <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                <div class="bg-red-500 h-full w-full"></div>
            </div>
        </div>

        <!-- 태그별 현황 -->
        <div class="mb-8">
            <h4 class="text-xs font-bold text-gray-400 mb-3">태그별</h4>
            <div class="space-y-3 text-sm">
                <div class="flex justify-between items-center">
                    <span class="text-gray-600 font-medium">업무</span>
                    <span class="text-xs font-bold text-gray-400">3/3</span>
                </div>
                <div class="w-full bg-black h-1 rounded-full"></div>

                <div class="flex justify-between items-center">
                    <span class="text-gray-600 font-medium">개인</span>
                    <span class="text-xs font-bold text-gray-400">1/1</span>
                </div>
                <div class="w-full bg-black h-1 rounded-full"></div>
            </div>
        </div>
    </aside>

</div>

<!-- 할 일 추가 모달 (기본 상태: hidden) -->
<div id="todoModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-extrabold">새 할 일 추가</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-black"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form action="{% url 'todo_create' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">제목</label>
                <input type="text" name="title" required placeholder="할 일을 입력하세요" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-black">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">날짜</label>
                    <input type="date" name="due_date" required class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">태그</label>
                    <select name="tag" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:border-black">
                        <option value="WORK">업무</option>
                        <option value="PERSONAL">개인</option>
                        <option value="HEALTH">건강</option>
                        <option value="STUDY">공부</option>
                        <option value="ETC">기타</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">우선순위</label>
                <div class="flex gap-4 text-sm mt-1">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="priority" value="H" class="accent-red-500"> <span class="text-red-500 font-bold">높음(H)</span></label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="priority" value="M" checked class="accent-amber-500"> <span class="text-amber-500 font-bold">보통(M)</span></label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="priority" value="L" class="accent-gray-400"> <span class="text-gray-400 font-bold">낮음(L)</span></label>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded text-sm text-gray-600 font-bold">취소</button>
                <button type="submit" class="px-4 py-2 bg-black text-white rounded text-sm font-bold">저장하기</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openModal() {
        document.getElementById('todoModal').classList.remove('hidden');
    }
    function closeModal() {
        document.getElementById('todoModal').classList.add('hidden');
    }
</script>
{% endblock %}
