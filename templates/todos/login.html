<!-- login.html -->
{% load static %}

<!DOCTYPE html>
<html lang='ko'>

<head>

    <meta charset='UTF-8'>

    <meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'>

    <title>TODOPL 로그인</title>

    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css'>

    <script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>

    <script src='https://cdn.tailwindcss.com'></script>

</head>


<body
    class='
        m-0
        min-h-dvh
        w-full
        bg-white
        font-sans
        text-[#111111]
    '
    data-supabase-url='{{ SUPABASE_URL }}'
    data-supabase-key='{{ SUPABASE_ANON_KEY }}'
>


    <main
        class='
            flex
            min-h-dvh
            w-full
            flex-col
            items-center
            px-6
            pt-[max(80px,env(safe-area-inset-top))]
            pb-[max(40px,env(safe-area-inset-bottom))]
        '
    >


        <!-- =========================================================
             브랜드
             ========================================================= -->

        <section
            class='
                mt-[100px]
                mb-[70px]
                flex
                w-full
                max-w-[430px]
                flex-col
                items-center

                max-[700px]:mt-[45px]
                max-[700px]:mb-[40px]

                max-[480px]:mt-[80px]
                max-[480px]:mb-[60px]
            '
        >

            <h1
                class='
                    m-0
                    text-[48px]
                    font-extrabold
                    leading-none
                    tracking-[-2px]

                    max-[480px]:text-[44px]
                '
            >
                TODOPL
            </h1>


            <p
                class='
                    mt-[18px]
                    mb-0
                    text-[20px]
                    font-normal
                    leading-normal
                    tracking-[-0.5px]
                    text-[#222222]

                    max-[480px]:mt-[16px]
                    max-[480px]:text-[19px]
                '
            >
                To Do Plan
            </p>

        </section>


        <!-- 로그인 Section -->
        <section class='w-full max-w-[430px]'>

            <form id='loginForm' class='w-full'>
                
                <!-- 이메일 ID Input -->
                <div class='relative mb-[14px] w-full'>

                    <i
                        class='
                            fa-regular
                            fa-user

                            pointer-events-none

                            absolute
                            left-5
                            top-1/2
                            z-[2]

                            -translate-y-1/2

                            text-[18px]
                            text-[#999999]
                        '
                    ></i>


                    <input
                        type='email'
                        id='email'
                        name='email'

                        class='
                            h-16
                            w-full

                            rounded-[14px]

                            border
                            border-[#dddddd]

                            bg-white

                            px-5
                            pl-[54px]

                            text-[17px]
                            text-[#111111]

                            outline-none

                            transition
                            duration-200
                            ease-in-out

                            placeholder:text-[#999999]

                            focus:border-[#363636]

                            focus:shadow-[0_0_0_3px_rgba(22,131,255,0.08)]

                            max-[480px]:h-[62px]
                            max-[480px]:text-[16px]
                        '

                        placeholder='이메일 아이디'
                        autocomplete='email'
                        required
                    >

                </div>


                <!-- 비밀번호 input -->
                <div
                    class='
                        relative
                        mb-[14px]
                        w-full
                    '
                >

                    <i
                        class='
                            fa-solid
                            fa-lock

                            pointer-events-none

                            absolute
                            left-5
                            top-1/2
                            z-[2]

                            -translate-y-1/2

                            text-[18px]
                            text-[#999999]
                        '
                    ></i>


                    <input
                        type='password'
                        id='password'
                        name='password'

                        class='
                            h-16
                            w-full

                            rounded-[14px]

                            border
                            border-[#dddddd]

                            bg-white

                            px-5
                            pl-[54px]

                            text-[17px]
                            text-[#111111]

                            outline-none

                            transition
                            duration-200
                            ease-in-out

                            placeholder:text-[#999999]

                            focus:border-[#363636]

                            focus:shadow-[0_0_0_3px_rgba(22,131,255,0.08)]

                            max-[480px]:h-[62px]
                            max-[480px]:text-[16px]
                        '

                        placeholder='비밀번호'
                        autocomplete='current-password'
                        required
                    >

                </div>


                <!-- 회원가입 / 비밀번호 재설정 -->
                <div
                    class='
                        mt-[18px]
                        flex
                        w-full
                        items-center
                        justify-between
                        px-1
                    '
                >

                    <button
                        type='button'

                        class='
                            border-0
                            bg-transparent
                            p-0

                            text-[15px]
                            font-normal
                            text-[#5c5c5c]

                            cursor-pointer

                            hover:underline

                            focus:outline-none
                        '

                        onclick='openSignupModal()'
                    >
                        회원가입
                    </button>


                    <button
                        type='button'

                        class='
                            border-0
                            bg-transparent
                            p-0

                            text-[15px]
                            font-normal
                            text-[#5c5c5c]

                            cursor-pointer

                            hover:underline

                            focus:outline-none
                        '

                        onclick='location.href="/find-account/"'
                    >
                        비밀번호 재설정
                    </button>

                </div>


                <!-- 로그인 버튼 -->
                <button
                    type='submit'

                    class='
                        mt-[34px]

                        h-16
                        w-full

                        rounded-[14px]

                        border-0

                        bg-[#2c2c2c]

                        text-[19px]
                        font-semibold
                        text-white

                        cursor-pointer

                        transition
                        duration-150
                        ease-in-out

                        hover:opacity-[0.92]

                        active:scale-[0.98]

                        focus:outline-none
                    '

                >
                    로그인
                </button>


            </form>


            <!-- 소셜 로그인 -->
            <div
                class='
                    mt-[48px]
                    w-full

                    max-[700px]:mt-[32px]
                '
            >


                <!-- -------------------------------------------------
                     구분선
                     ------------------------------------------------- -->

                <div
                    class='
                        flex
                        w-full
                        items-center
                        gap-4
                    '
                >

                    <span
                        class='
                            h-px
                            flex-1
                            bg-[#dddddd]
                        '
                    ></span>


                    <p
                        class='
                            m-0
                            shrink-0
                            text-[14px]
                            font-normal
                            text-[#999999]
                        '
                    >
                        또는
                    </p>


                    <span
                        class='
                            h-px
                            flex-1
                            bg-[#dddddd]
                        '
                    ></span>

                </div>



                <!-- -------------------------------------------------
                     소셜 로그인 버튼
                     ------------------------------------------------- -->

                <div
                    class='
                        mt-[30px]

                        flex
                        items-center
                        justify-center

                        gap-[54px]

                        max-[480px]:gap-[42px]

                        max-[700px]:mt-[20px]
                    '
                >


                    <!-- =================================================
                         Naver
                         ================================================= -->

                    <button
                        type='button'

                        class='
                            flex
                            h-16
                            w-16
                            shrink-0

                            items-center
                            justify-center

                            rounded-full

                            border-0

                            bg-[#03C75A]

                            text-white

                            cursor-pointer

                            transition
                            duration-150
                            ease-in-out

                            hover:scale-[0.94]

                            active:scale-[0.90]

                            focus:outline-none
                        '

                        onclick='SocialLogin("naver")'

                        aria-label='네이버 로그인'
                    >

                        <span
                            class='
                                text-[27px]
                                font-bold
                                leading-none
                            '
                        >
                            N
                        </span>

                    </button>



                    <!-- =================================================
                         Google
                         ================================================= -->

                    <button
                        type='button'

                        class='
                            flex
                            h-16
                            w-16
                            shrink-0

                            items-center
                            justify-center

                            rounded-full

                            border-0

                            bg-white

                            shadow-[0_2px_6px_rgba(0,0,0,0.12)]

                            cursor-pointer

                            transition
                            duration-150
                            ease-in-out

                            hover:scale-[0.94]

                            hover:shadow-[0_3px_8px_rgba(0,0,0,0.16)]

                            active:scale-[0.90]

                            active:shadow-[0_1px_4px_rgba(0,0,0,0.12)]

                            focus:outline-none

                            focus-visible:ring-4
                            focus-visible:ring-blue-500/25
                        '

                        onclick='SocialLogin("google")'

                        aria-label='Google로 로그인'
                    >

                        <svg
                            xmlns='http://www.w3.org/2000/svg'
                            viewBox='0 0 48 48'

                            class='
                                h-7
                                w-7
                            '
                        >

                            <path
                                fill='#EA4335'
                                d='M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z'
                            ></path>


                            <path
                                fill='#4285F4'
                                d='M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z'
                            ></path>


                            <path
                                fill='#FBBC05'
                                d='M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 2.56 34.78l7.97-6.19z'
                            ></path>


                            <path
                                fill='#34A853'
                                d='M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z'
                            ></path>


                            <path
                                fill='none'
                                d='M0 0h48v48H0z'
                            ></path>

                        </svg>

                    </button>



                    <!-- =================================================
                         Apple
                         ================================================= -->

                    <button
                        type='button'

                        class='
                            flex
                            h-16
                            w-16
                            shrink-0

                            items-center
                            justify-center

                            rounded-full

                            border-0

                            bg-black

                            text-white

                            cursor-pointer

                            transition
                            duration-150
                            ease-in-out

                            hover:scale-[0.94]

                            active:scale-[0.90]

                            focus:outline-none
                        '

                        onclick='SocialLogin("apple")'

                        aria-label='Apple 로그인'
                    >

                        <span
                            class='
                                text-[31px]
                                leading-none
                                text-white
                            '
                        >
                            
                        </span>

                    </button>

                </div>


            </div>


        </section>


    </main>



    <!-- 로그인 JS -->
    <script>

        document
            .getElementById('loginForm')
            .addEventListener(
                'submit',
                async function(Event) {

                    Event.preventDefault();


                    const Email =
                        document
                            .getElementById(
                                'email'
                            )
                            .value
                            .trim();


                    const Password =
                        document
                            .getElementById(
                                'password'
                            )
                            .value;


                    try {

                        const FormDataValue =
                            new FormData();


                        FormDataValue.append(
                            'email',
                            Email
                        );


                        FormDataValue.append(
                            'password',
                            Password
                        );


                        const Response =
                            await fetch(
                                '/login/auth/',
                                {
                                    method: 'POST',

                                    headers: {

                                        'X-CSRFToken':
                                            getCookie(
                                                'csrftoken'
                                            )

                                    },

                                    body:
                                        FormDataValue

                                }
                            );


                        const Data =
                            await Response.json();


                        if (!Data.success) {

                            alert(
                                Data.message
                            );

                            return;

                        }


                        console.log(
                            'Supabase 로그인 성공'
                        );


                        window.location.href =
                            '/';


                    }
                    catch (Error) {

                        console.error(
                            '로그인 오류:',
                            Error
                        );


                        alert(
                            '로그인 중 오류가 발생했습니다.'
                        );

                    }

                }
            );




        //      소셜 로그인
        function SocialLogin(
            Provider
        ) {

            console.log(
                '소셜 로그인:',
                Provider
            );


            if (
                Provider === 'google'
            ) {

                window.location.href =
                    '/login/google/';

                return;

            }


            alert(
                '지원하지 않는 소셜 로그인'
            );

            /*
                추후 연결

                Naver

                Apple
            */

        }

    </script>



    <!-- 회원가입 signup_modal.html에서 관리 -->
    {% include 'todos/partials/signup_modal.html' %}

    <script src="{% static 'todos/js/signup_modal.js' %}"></script>



    <!-- Supabase -->
    <script>

        const SupabaseUrl =
            '{{ SUPABASE_URL|escapejs }}';


        const SupabaseAnonKey =
            '{{ SUPABASE_ANON_KEY|escapejs }}';


        console.log(
            'Supabase URL:',
            SupabaseUrl
        );


        console.log(
            'Supabase Key 존재:',
            !!SupabaseAnonKey
        );


        const SupabaseClient =
            window.supabase.createClient(
                SupabaseUrl,
                SupabaseAnonKey
            );



        function getCookie(
            Name
        ) {

            const Cookies =
                document.cookie.split(
                    ';'
                );


            for (
                const Cookie of Cookies
            ) {

                const [
                    Key,
                    Value
                ] =
                    Cookie
                        .trim()
                        .split(
                            '='
                        );


                if (
                    Key === Name
                ) {

                    return decodeURIComponent(
                        Value
                    );

                }

            }


            return null;

        }

    </script>


</body>

</html>
