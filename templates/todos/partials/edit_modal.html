<!--
    ==================================================================
    Todo 수정 모달
    ==================================================================
-->

<div
    id='editModal'
    class='fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4'>


    <div
        class='bg-white rounded-2xl w-full max-w-md p-6 shadow-xl'>


        <!-- 헤더 -->

        <div
            class='flex justify-between items-center mb-5'>

            <h3
                class='text-lg font-bold text-gray-900'>

                할 일 수정

            </h3>


            <button
                type='button'
                onclick='closeEditModal()'
                class='text-gray-400 hover:text-gray-600'>

                <i class='fa-solid fa-xmark text-xl'></i>

            </button>

        </div>


        <!-- 수정 Form -->

        <form
            id='editForm'
            method='POST'
            action=''
            data-todo-edit-form>


            {% csrf_token %}


            <!-- 현재 화면 상태 유지 -->

            <input
                type='hidden'
                name='year'
                value='{{ year }}'>


            <input
                type='hidden'
                name='month'
                value='{{ month }}'>


            <input
                type='hidden'
                name='current_tag'
                value='{{ selected_tag }}'>


            <input
                type='hidden'
                name='date'
                value='{{ selected_date }}'>


            <input
                type='hidden'
                name='return_url'
                value='{{ request.get_full_path }}'>


            <div
                class='space-y-4'>


                <!-- 제목 -->

                <div>

                    <label
                        class='block text-xs font-semibold text-gray-500 mb-1'>

                        제목

                    </label>


                    <input
                        type='text'
                        id='edit-title'
                        name='title'
                        required
                        class='w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black'>

                </div>


                <!-- 태그 / 우선순위 -->

                <div
                    class='grid grid-cols-2 gap-3'>


                    <!-- 태그 -->
                    <div>

                        <label
                            class='block text-xs font-semibold text-gray-500 mb-1'>

                            태그

                        </label>


                        <select
                            id='edit-tag'
                            name='tag'
                            required
                            class='w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black'>


                            {% if user_tags %}

                                {% for tag in user_tags %}

                                    <option
                                        value='{{ tag.id }}'
                                        data-tag-id="{{ tag.id }}">

                                        {{ tag.name }}

                                    </option>

                                {% endfor %}


                            {% else %}

                                <option
                                    value='{{ default_etc_tag.id }}'>

                                    기타

                                </option>

                            {% endif %}


                        </select>

                    </div>


                    <!-- 우선순위 -->

                    <div>

                        <label
                            class='block text-xs font-semibold text-gray-500 mb-1'>

                            우선순위

                        </label>


                        <select
                            id='edit-priority'
                            name='priority'
                            class='w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black'>


                            <option value='H'>
                                높음
                            </option>


                            <option value='M'>
                                보통
                            </option>


                            <option value='L'>
                                낮음
                            </option>


                        </select>

                    </div>

                </div>


                <!-- 일정 유형 -->

                <div>

                    <label
                        class='block text-xs font-semibold text-gray-500 mb-2'>

                        일정

                    </label>


                    <div
                        class='flex gap-5 text-sm'>


                        <!-- 하루 -->

                        <label
                            class='flex items-center gap-1.5 cursor-pointer'>

                            <input
                                type='radio'
                                name='schedule_type'
                                value='single'
                                id='edit-schedule-single'
                                onchange='toggleEditEndDate()'
                                class='accent-black'>


                            <span>
                                하루
                            </span>

                        </label>


                        <!-- 기간 -->

                        <label
                            class='flex items-center gap-1.5 cursor-pointer'>

                            <input
                                type='radio'
                                name='schedule_type'
                                value='range'
                                id='edit-schedule-range'
                                onchange='toggleEditEndDate()'
                                class='accent-black'>


                            <span>
                                기간
                            </span>

                        </label>

                    </div>

                </div>


                <!-- 날짜 -->

                <div
                    class='grid grid-cols-2 gap-3'>


                    <!-- 시작일 -->

                    <div>

                        <label
                            class='block text-xs font-semibold text-gray-500 mb-1'>

                            시작일

                        </label>


                        <div
                            class='relative cursor-pointer'
                            onclick="openDatePicker('edit-due_date')">


                            <input
                                type='date'
                                id='edit-due_date'
                                name='due_date'
                                required
                                onclick="openDatePicker('edit-due_date'); event.stopPropagation();"
                                class='w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black cursor-pointer'>


                        </div>

                    </div>


                    <!-- 종료일 -->

                    <div
                        id='edit-endDateWrapper'
                        class='hidden'>


                        <label
                            class='block text-xs font-semibold text-gray-500 mb-1'>

                            종료일

                        </label>


                        <div
                            class='relative cursor-pointer'
                            onclick="openDatePicker('edit-end_date')">


                            <input
                                type='date'
                                id='edit-end_date'
                                name='end_date'
                                onclick="openDatePicker('edit-end_date'); event.stopPropagation();"
                                class='w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black cursor-pointer'>


                        </div>

                    </div>

                </div>

            </div>


            <!-- 버튼 -->

            <div
                class='flex gap-2 mt-6'>


                <button
                    type='button'
                    onclick='closeEditModal()'
                    class='flex-1 py-2 text-sm font-medium text-gray-500 bg-gray-100 rounded-lg'>

                    취소

                </button>


                <button
                    type='submit'
                    class='flex-1 py-2 text-sm font-medium text-white bg-black rounded-lg'>

                    저장

                </button>


            </div>


        </form>

    </div>

</div>
