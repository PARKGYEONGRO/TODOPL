<!--
    ============================================================
    회원가입 모달
    ============================================================
-->

<div
    id='signupModal'
    class='signup-modal-overlay'
    aria-hidden='true'
>


    <!-- 모달 -->

    <div
        class='signup-modal'
        role='dialog'
        aria-modal='true'
        aria-labelledby='signupModalTitle'
    >


        <!-- 헤더 -->

        <div class='signup-modal-header'>

            <h2
                id='signupModalTitle'
                class='signup-modal-title'
            >
                회원가입
            </h2>


            <button
                type='button'
                class='signup-close-button'
                onclick='closeSignupModal()'
                aria-label='회원가입 모달 닫기'
            >

                <i class='fa-solid fa-xmark'></i>

            </button>

        </div>


        <!-- 내용 -->

        <form
            id='signupForm'
            method='post'
            class='signup-form'
        >


            <!-- 이메일 -->

            <div class='signup-input-group'>

                <label
                    for='signupEmail'
                    class='signup-label'
                >
                    이메일
                </label>


                <div class='signup-input-wrapper'>

                    <i
                        class='fa-regular fa-envelope signup-input-icon'>
                    </i>


                    <input
                        type='email'
                        id='signupEmail'
                        name='email'
                        class='signup-input'
                        placeholder='이메일을 입력하세요'
                        autocomplete='email'
                        required
                    >

                </div>

            </div>


            <!-- 비밀번호 -->

            <div class='signup-input-group'>

                <label
                    for='signupPassword'
                    class='signup-label'
                >
                    비밀번호
                </label>


                <div class='signup-input-wrapper'>

                    <i
                        class='fa-solid fa-lock signup-input-icon'>
                    </i>


                    <input
                        type='password'
                        id='signupPassword'
                        name='password'
                        class='signup-input'
                        placeholder='비밀번호를 입력하세요'
                        autocomplete='new-password'
                        required
                    >

                </div>

            </div>


            <!-- 비밀번호 확인 -->

            <div class='signup-input-group'>

                <label
                    for='signupPasswordConfirm'
                    class='signup-label'
                >
                    비밀번호 확인
                </label>


                <div class='signup-input-wrapper'>

                    <i
                        class='fa-solid fa-lock signup-input-icon'>
                    </i>


                    <input
                        type='password'
                        id='signupPasswordConfirm'
                        name='password_confirm'
                        class='signup-input'
                        placeholder='비밀번호를 다시 입력하세요'
                        autocomplete='new-password'
                        required
                    >

                </div>


                <p
                    id='signupPasswordMessage'
                    class='signup-message'
                ></p>

            </div>


            <!-- 회원가입 버튼 -->

            <button
                type='submit'
                id='signupSubmitButton'
                class='signup-submit-button'
            >
                회원가입
            </button>


        </form>


        <!-- 로그인으로 돌아가기 -->

        <div class='signup-login-link'>

            <span>
                이미 계정이 있으신가요?
            </span>


            <button
                type='button'
                onclick='closeSignupModal()'
            >
                로그인
            </button>

        </div>


    </div>

</div>


<style>

/*
    ============================================================
    회원가입 모달
    ============================================================
*/


.signup-modal-overlay {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 24px;

    background:
        rgba(0, 0, 0, 0.45);

    backdrop-filter:
        blur(4px);

}


.signup-modal-overlay.is-open {

    display: flex;

}


/*
    ============================================================
    모달
    ============================================================
*/


.signup-modal {

    width: 100%;

    max-width: 430px;

    max-height: calc(100dvh - 48px);

    overflow-y: auto;

    padding: 28px;

    border-radius: 22px;

    background: #ffffff;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.18);

    animation:
        signupModalOpen
        0.2s ease;

}


@keyframes signupModalOpen {

    from {

        opacity: 0;

        transform:
            translateY(12px)
            scale(0.98);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/*
    ============================================================
    헤더
    ============================================================
*/


.signup-modal-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 28px;

}


.signup-modal-title {

    margin: 0;

    font-size: 24px;

    font-weight: 800;

    letter-spacing: -0.8px;

}


.signup-close-button {

    width: 36px;

    height: 36px;

    padding: 0;

    border: 0;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #f5f5f5;

    color: #666666;

    font-size: 16px;

    cursor: pointer;

}


.signup-close-button:hover {

    background: #eeeeee;

}


/*
    ============================================================
    입력 영역
    ============================================================
*/


.signup-form {

    width: 100%;

}


.signup-input-group {

    width: 100%;

    margin-bottom: 18px;

}


.signup-label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 700;

    color: #222222;

}


.signup-input-wrapper {

    position: relative;

    width: 100%;

}


.signup-input-icon {

    position: absolute;

    left: 18px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #999999;

    font-size: 16px;

    pointer-events: none;

}


.signup-input {

    width: 100%;

    height: 58px;

    padding:
        0 18px 0 48px;

    border: 1px solid #dddddd;

    border-radius: 13px;

    outline: none;

    background: #ffffff;

    color: #111111;

    font-size: 16px;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;

}


.signup-input::placeholder {

    color: #aaaaaa;

}


.signup-input:focus {

    border-color: #2c2c2c;

    box-shadow:
        0 0 0 3px
        rgba(0, 0, 0, 0.06);

}


/*
    ============================================================
    메시지
    ============================================================
*/


.signup-message {

    min-height: 18px;

    margin:
        6px 2px 0;

    font-size: 12px;

    color: #e53935;

}


/*
    ============================================================
    회원가입 버튼
    ============================================================
*/


.signup-submit-button {

    width: 100%;

    height: 60px;

    margin-top: 8px;

    border: 0;

    border-radius: 13px;

    background: #2c2c2c;

    color: #ffffff;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;

}


.signup-submit-button:hover {

    opacity: 0.92;

}


.signup-submit-button:active {

    transform:
        scale(0.98);

}


.signup-submit-button:disabled {

    opacity: 0.5;

    cursor: not-allowed;

}


/*
    ============================================================
    로그인 링크
    ============================================================
*/


.signup-login-link {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    margin-top: 22px;

    font-size: 13px;

    color: #888888;

}


.signup-login-link button {

    padding: 0;

    border: 0;

    background: transparent;

    color: #333333;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

}


.signup-login-link button:hover {

    text-decoration: underline;

}


/*
    ============================================================
    모바일
    ============================================================
*/


@media (
    max-width: 480px
) {

    .signup-modal-overlay {

        align-items: flex-end;

        padding: 0;

    }


    .signup-modal {

        max-width: none;

        max-height:
            calc(100dvh - 20px);

        padding:
            26px 22px
            max(26px, env(safe-area-inset-bottom));

        border-radius:
            22px 22px 0 0;

    }

}

</style>
