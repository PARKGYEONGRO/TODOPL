<!-- profile_setting.html -->
<div
    id='profilePage'
    class='fixed inset-0 z-[70] hidden bg-black/30'
    onclick='backdropClick(event)'>


    <div
        class='h-full flex flex-col bg-white
            md:w-[430px] md:ml-auto
            md:shadow-2xl'
        onclick='event.stopPropagation()'>


        <!-- ========================================================
             상단
        ========================================================= -->

        <header
            class='relative flex items-center justify-center px-5 py-5'>


            <button
                type='button'
                onclick='closeProfilePage()'
                class='absolute left-4 w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 active:bg-white/10 transition'>

                <i
                    class='fa-solid fa-chevron-left text-xl'>
                </i>

            </button>


            <h1
                class='text-xl font-extrabold'>

                닉네임

            </h1>

        </header>


        <!-- ========================================================
             탭
        ========================================================= -->

        <div
            class='grid grid-cols-3 border-b border-white/10'>


            <button
                type='button'
                class='py-4 text-lg font-bold text-gray-400 border-b-2 border-gray-200'>

                Profile

            </button>


            <button
                type='button'
                class='py-4 text-lg font-bold text-gray-900'>

                Following

            </button>


            <button
                type='button'
                class='py-4 text-lg font-bold text-gray-900'>

                Followers

            </button>

        </div>


        <!-- ========================================================
             프로필 내용
        ========================================================= -->

        <main
            class='flex-1 overflow-y-auto px-5 py-8'>


            <!-- 프로필 이미지 -->

            <div
                class='flex justify-center mb-10'>


                <div
                    class='relative'>


                    <div
                        class='w-40 h-40 rounded-full bg-gray-700 flex items-center justify-center'>


                        <i
                            class='fa-regular fa-user text-7xl text-gray-300'>
                        </i>


                    </div>


                    <!-- 이미지 수정 -->

                    <button
                        type='button'
                        class='absolute right-0 bottom-0 w-14 h-14 rounded-full bg-white text-gray-900 flex items-center justify-center shadow-lg'>

                        <i
                            class='fa-solid fa-pen text-xl'>
                        </i>

                    </button>

                </div>

            </div>


            <!-- 이메일 ID -->
            <section
                class='mb-8'>


                <h2
                    class='text-2xl font-extrabold mb-4'>

                    이메일 ID

                </h2>


                <div
                    class='rounded-2xl bg-gray-50 px-5 py-5 flex items-center gap-4'>


                    <div
                        class='w-14 h-14 rounded-full bg-yellow-400 text-gray-900 flex items-center justify-center flex-shrink-0'>

                        <i
                            class='fa-solid fa-comment text-2xl'> <!-- provider 아이콘 -->
                        </i>

                    </div>


                    <p
                        class='text-xl text-gray-300 font-medium break-all'>

                        example@example.com

                    </p>

                </div>

            </section>


            <!-- ====================================================
                 프로필 설정
            ===================================================== -->

            <section
                class='mb-8'>


                <h2
                    class='text-2xl font-extrabold mb-4'>

                    프로필 설정

                </h2>


                <div
                    class='rounded-2xl bg-gray-50 overflow-hidden'>


                    <!-- 이름 -->

                    <button
                        type='button'
                        class='w-full px-5 py-5 flex items-center gap-4 text-left border-b border-white/5'>


                        <div
                            class='flex-1 min-w-0'>


                            <p
                                class='text-xl font-medium'>

                                닉네임

                            </p>

                        </div>


                        <i
                            class='fa-solid fa-pen text-xl text-white'>
                        </i>


                        <div
                            class='w-px h-8 bg-white/10'>
                        </div>


                        <span
                            class='text-xl text-gray-500 font-bold'>

                            #닉네임태그

                        </span>

                    </button>


                    <!-- 한줄 소개 -->

                    <button
                        type='button'
                        class='w-full px-5 py-5 flex items-center text-left'>


                        <p
                            class='flex-1 text-xl text-gray-500'>

                            한 줄 소개를 입력하세요...

                        </p>


                        <i
                            class='fa-solid fa-pen text-xl text-white'>
                        </i>

                    </button>

                </div>

            </section>


            <!-- 저장 버튼-->
            <button
                type='button'
                onclick='saveProfile()'
                class='w-full py-5 rounded-full bg-black text-white text-2xl font-extrabold active:scale-[0.99] transition'>

                저장

            </button>


        </main>

    </div>

</div>
