<!-- ============================================================
     친구 추가
============================================================ -->

<div
    class='h-full overflow-y-auto'
>

    <!-- ========================================================
         친구 추가 상단 영역
    ========================================================= -->

   <div
        class='relative overflow-hidden border-b border-gray-200 bg-white px-5 py-8'
    >

        <!-- 텍스트 -->

        <div
            class='relative z-10 pr-28'
        >

            <h2
                class='text-2xl font-extrabold tracking-tight text-gray-900'
            >
                친구 추가하기
            </h2>


            <p
                class='mt-3 text-base leading-relaxed text-gray-500'
            >
                사용자명과 닉네임 태그를 사용하여 친구를 추가할 수 있어요.
            </p>

        </div>


        <!-- 로봇 아이콘 영역 -->

        <div
            class='absolute right-5 top-4 flex h-24 w-24 items-center justify-center'
        >

            <div
                class='relative flex h-16 w-16 items-center justify-center rounded-3xl bg-indigo-500 shadow-lg'
            >

                <!-- 얼굴 -->

                <div
                    class='flex h-11 w-12 items-center justify-center rounded-2xl bg-indigo-100'
                >

                    <i
                        class='fa-solid fa-robot text-2xl text-indigo-600'
                    ></i>

                </div>


                <!-- 장식 -->

                <div
                    class='absolute -left-3 top-7 h-5 w-3 rounded-l-full bg-indigo-400'
                ></div>


                <div
                    class='absolute -right-3 top-7 h-5 w-3 rounded-r-full bg-indigo-400'
                ></div>


                <div
                    class='absolute -top-3 right-0 flex h-5 w-5 items-center justify-center rounded-full bg-emerald-400'
                >

                    <i
                        class='fa-solid fa-plus text-[8px] text-white'
                    ></i>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================================================
         친구 추가 폼
    ========================================================= -->

    <div
        class='px-5 py-6'
    >

        <!-- 입력 카드 -->

        <div
            class='rounded-2xl border border-gray-200 bg-gray-50 p-2 shadow-sm'
        >

            <div
                class='flex items-center gap-2'
            >

                <!-- 입력 -->

                <input
                    type='text'
                    id='addFriendInput'
                    placeholder='사용자명 입력하기'
                    autocomplete='off'
                    class='
                        min-w-0
                        flex-1
                        border-0
                        bg-transparent
                        px-4
                        py-4
                        text-base
                        font-medium
                        text-gray-900
                        outline-none
                        placeholder:text-gray-400
                        focus:ring-0
                    '
                >


                <!-- 요청 버튼 -->

                <button
                    type='button'
                    id='sendFriendRequestButton'
                    class='
                        flex-shrink-0
                        rounded-xl
                        bg-indigo-500
                        px-4
                        py-3
                        text-sm
                        font-bold
                        text-white
                        transition
                        duration-150
                        hover:bg-indigo-600
                        active:scale-[0.98]
                    '
                >
                    친구 요청 보내기
                </button>

            </div>

        </div>


        <!-- 입력 안내 -->

        <p
            class='mt-3 px-1 text-sm leading-relaxed text-gray-400'
        >
            친구의 사용자명 또는 사용자명과 닉네임 태그를 입력해주세요.
        </p>


        <!-- ====================================================
             구분선
        ==================================================== -->

        <div
            class='my-8 border-t border-gray-100'
        ></div>


        <!-- ====================================================
             하단 안내
        ==================================================== -->

        <div
            class='flex flex-col items-center justify-center px-5 py-10 text-center'
        >

            <div
                class='mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-gray-100'
            >

                <i
                    class='fa-solid fa-user-plus text-2xl text-gray-400'
                ></i>

            </div>


            <h3
                class='text-lg font-bold text-gray-700'
            >
                새로운 친구를 추가해보세요
            </h3>


            <p
                class='mt-2 max-w-[280px] text-sm leading-relaxed text-gray-400'
            >
                사용자명으로 친구를 검색하고 친구 요청을 보낼 수 있습니다.
            </p>

        </div>

    </div>

</div>
