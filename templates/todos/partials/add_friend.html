<!-- add_friend.html -->

<div
    class='h-full overflow-y-auto bg-white'
>


    <!-- 친구 추가 상단 영역 -->
    <div
        class='relative overflow-hidden border-b border-gray-100 px-5 py-8'
    >

        <!-- 텍스트 -->
        <div
            class='relative z-10 pr-28'
        >

            <h2
                class='text-2xl font-extrabold tracking-tight text-gray-900'
            >
                친구 추가하기
            </h2>


            <p
                class='mt-3 text-base leading-relaxed text-gray-500'
            >
                사용자명(닉네임#닉네임 태그)를 사용하여 친구를 추가할 수 있어요.
            </p>

        </div>


        <!-- 아이콘 -->
        <div
            class='absolute right-5 top-4 flex h-24 w-24 items-center justify-center'
        >

            <div
                class='relative flex h-16 w-16 items-center justify-center rounded-3xl bg-indigo-500 shadow-lg'
            >

                <div
                    class='flex h-11 w-12 items-center justify-center rounded-2xl bg-indigo-100'
                >

                    <i
                        class='fa-solid fa-user-plus text-xl text-indigo-600'
                    ></i>

                </div>


                <div
                    class='absolute -left-3 top-7 h-5 w-3 rounded-l-full bg-indigo-400'
                ></div>


                <div
                    class='absolute -right-3 top-7 h-5 w-3 rounded-r-full bg-indigo-400'
                ></div>


                <div
                    class='absolute -top-3 right-0 flex h-5 w-5 items-center justify-center rounded-full bg-emerald-400'
                >

                    <i
                        class='fa-solid fa-plus text-[8px] text-white'
                    ></i>

                </div>

            </div>

        </div>

    </div>


    <!-- 친구 추가 영역 -->
    <div
        class='px-5 py-6'
    >

        <!-- 입력 카드 -->
        <div
            class='rounded-2xl border border-gray-200 bg-gray-50 p-2 shadow-sm'
        >

            <div
                class='flex items-center gap-2'
            >

                <input
                    type='text'
                    id='addFriendInput'
                    placeholder='사용자명 입력하기'
                    autocomplete='off'
                    class='
                        min-w-0
                        flex-1
                        border-0
                        bg-transparent
                        px-4
                        py-4
                        text-base
                        font-medium
                        text-gray-900
                        outline-none
                        placeholder:text-gray-400
                        focus:ring-0
                    '
                >


                <button
                    type='button'
                    id='sendFriendRequestButton'
                    class='
                        flex-shrink-0
                        rounded-xl
                        bg-indigo-500
                        px-4
                        py-3
                        text-sm
                        font-bold
                        text-white
                        transition
                        duration-150
                        hover:bg-indigo-600
                        active:scale-[0.98]
                    '
                >
                    친구 요청 보내기
                </button>

            </div>

        </div>


        <!-- 본인 정보 -->
        <div
            class='mt-4 flex items-center gap-3 px-2'
        >

            <div
                class='
                    flex
                    h-9
                    w-9
                    flex-shrink-0
                    items-center
                    justify-center
                    rounded-full
                    bg-gray-100
                '
            >

                <i
                    class='fa-solid fa-user text-sm text-gray-400'
                ></i>

            </div>


            <div
                class='min-w-0'
            >

                <p
                    class='text-xs font-medium text-gray-400'
                >
                    내 사용자명
                </p>


                <p
                    class='truncate text-sm font-bold text-gray-600'
                >
                    {{ request.user.profile.nickname }}#{{ request.user.profile.nickname_tag }}
                </p>

            </div>

        </div>


        <!-- 입력 안내 -->
        <p
            class='mt-4 px-1 text-sm leading-relaxed text-gray-400'
        >
            친구의 사용자명과 닉네임 태그를 입력해주세요.
        </p>


        <!-- ====================================================
             구분선
        ==================================================== -->
        <div
            class='my-8 border-t border-gray-100'
        ></div>


        <!-- ====================================================
             친구 요청 상태
        ==================================================== -->
        <section>

            <div
                class='mb-5 flex items-center justify-between'
            >

                <div>

                    <h3
                        class='text-xl font-extrabold text-gray-900'
                    >
                        새로운 친구
                    </h3>


                    <p
                        class='mt-1 text-sm text-gray-400'
                    >
                        친구 요청 상태를 확인하세요.
                    </p>

                </div>


                <span
                    id='newFriendCount'
                    class='text-sm font-bold text-gray-400'
                >
                    0
                </span>

            </div>


            <div
                id='newFriendList'
                class='space-y-3'
            >

            </div>

        </section>


        <!-- ====================================================
             하단 안내
        ==================================================== -->
        <div
            class='pt-8'
        >

            <div
                class='rounded-2xl bg-gray-50 px-5 py-5'
            >

                <div
                    class='flex items-start gap-3'
                >

                    <div
                        class='
                            flex
                            h-10
                            w-10
                            flex-shrink-0
                            items-center
                            justify-center
                            rounded-full
                            bg-white
                        '
                    >

                        <i
                            class='
                                fa-solid
                                fa-user-group
                                text-sm
                                text-gray-400
                            '
                        ></i>

                    </div>


                    <p
                        class='text-sm leading-relaxed text-gray-400'
                    >
                        친구 요청을 수락하면 친구 목록에서 서로 연결됩니다.
                    </p>

                </div>

            </div>

        </div>


    </div>

</div>
