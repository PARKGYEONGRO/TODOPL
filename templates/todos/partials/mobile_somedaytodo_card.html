<!-- mobile_somedaytodo_card.html -->

{% for someday_todo in someday_todos %}

<div
    id="someday-card-{{ someday_todo.id }}"

    data-someday-id="{{ someday_todo.id }}"
    data-mobile-someday-sort-item
    data-mobile-someday-id="{{ someday_todo.id }}"
    data-completed="{% if someday_todo.is_completed %}1{% else %}0{% endif %}"
    data-priority="{{ someday_todo.priority }}"
    data-created-at="{{ someday_todo.created_at|date:'U.u' }}"

    class="relative flex items-center gap-3 px-3 py-3
           border border-gray-200 rounded-xl
           {% if someday_todo.is_completed %}
               bg-gray-50
           {% else %}
               bg-white
           {% endif %}">


    <!-- 우선순위 왼쪽 막대 -->

    <div
        class="w-1 h-7 rounded-full flex-shrink-0

        {% if someday_todo.priority == 'H' %}
            bg-red-500
        {% elif someday_todo.priority == 'M' %}
            bg-orange-400
        {% else %}
            bg-green-500
        {% endif %}">

    </div>


    <!-- 완료 -->

    <button
        type="button"

        data-someday-toggle

        onclick="toggleSomedayTodo({{ someday_todo.id }})"

        class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0

        {% if someday_todo.is_completed %}
            bg-gray-950 text-white
        {% else %}
            border-2 border-gray-300 bg-white
        {% endif %}">


        {% if someday_todo.is_completed %}

            <i class="fa-solid fa-check text-[10px]"></i>

        {% endif %}


    </button>


    <!-- 내용 -->

    <div class="flex-1 min-w-0">


        <!-- 제목 -->

        <p
            id="someday-title-{{ someday_todo.id }}"

            class="text-[13px] font-medium

            {% if someday_todo.is_completed %}
                text-gray-400 line-through
            {% else %}
                text-gray-900
            {% endif %}">

            {{ someday_todo.title }}

        </p>


        <!-- 태그 + 우선순위 -->

        <div class="flex items-center gap-2 mt-1">


            <!-- 태그 -->

            <span
                data-someday-tag
                data-tag-id="{{ todo.tag.id }}"
                class="px-2 py-0.5 rounded-md
                       border border-gray-200
                       text-[10px] text-gray-600">

                {% if someday_todo.tag %}
                    {{ someday_todo.tag.name }}
                {% else %}
                    기타
                {% endif %}

            </span>


            <!-- 우선순위 -->

            <span
                data-someday-priority
                class="px-2 py-0.5 rounded-full
                       text-xs font-bold

                {% if someday_todo.priority == 'H' %}

                    bg-red-100 text-red-500

                {% elif someday_todo.priority == 'M' %}

                    bg-orange-100 text-orange-500

                {% else %}

                    bg-green-100 text-green-500

                {% endif %}">


                {% if someday_todo.priority == 'H' %}

                    높음

                {% elif someday_todo.priority == 'M' %}

                    보통

                {% else %}

                    낮음

                {% endif %}


            </span>


        </div>


    </div>


    <!-- 오른쪽 버튼 -->

    <div class="flex items-center gap-1">


        <!-- 수정 -->

        <button
            type="button"

            data-someday-edit

            data-id="{{ someday_todo.id }}"
            data-title="{{ someday_todo.title|escapejs }}"

            data-tag="{% if someday_todo.tag %}{{ someday_todo.tag.id }}{% endif %}"

            data-priority="{{ someday_todo.priority }}"

            onclick="openSomedayEditModal(this)"

            class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center">


            <i
                class="fa-regular fa-pen-to-square
                       text-[16px] text-gray-500">
            </i>


        </button>


        <!-- 삭제 -->

        <button
            type="button"

            data-someday-delete

            data-id="{{ someday_todo.id }}"
            data-title="{{ someday_todo.title|escapejs }}"

            onclick="openSomedayDeleteModal(this)"

            class="w-9 h-9 rounded-full
                   hover:bg-red-50
                   flex items-center justify-center">


            <i
                class="fa-regular fa-trash-can
                       text-[16px] text-gray-400">
            </i>


        </button>


    </div>


</div>


{% empty %}

<div class="py-6 text-center text-[11px] text-gray-400">

    아직 등록된 할 일이 없습니다.

</div>

{% endfor %}
