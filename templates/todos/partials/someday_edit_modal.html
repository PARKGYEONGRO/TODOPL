<!--
    ============================================================
    언젠가 할 일 수정 모달
    ============================================================
-->

<div
    id="somedayEditModal"
    class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 p-4">


    <div
        class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl">


        <!-- 헤더 -->

        <div class="flex justify-between items-center mb-5">

            <h3 class="text-lg font-bold text-gray-900">

                언젠가 할 일 수정

            </h3>


            <button
                type="button"
                onclick="closeSomedayEditModal()"
                class="text-gray-400 hover:text-gray-600">

                <i class="fa-solid fa-xmark text-xl"></i>

            </button>

        </div>


        <!-- Form -->

        <form
            id="somedayEditForm"
            method="POST"
            action="">


            {% csrf_token %}


            <!-- 현재 위치 유지 -->

            <input
                type="hidden"
                name="return_url"
                value="{{ request.get_full_path }}">


            <div class="space-y-4">


                <!-- 제목 -->

                <div>

                    <label
                        class="block text-xs font-semibold text-gray-500 mb-1">

                        제목

                    </label>


                    <input
                        type="text"
                        id="someday-edit-title"
                        name="title"
                        required
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black">

                </div>


                <!-- 태그 -->
                    <div>

                        <label
                            class='block text-xs font-semibold text-gray-500 mb-1'>

                            태그

                        </label>


                        <select
                            id='someday-edit-tag'
                            name='tag'
                            required
                            class='w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-black'>


                            {% if user_tags %}

                                {% for tag in user_tags %}

                                    <option
                                        value='{{ tag.id }}'>

                                        {{ tag.name }}

                                    </option>

                                {% endfor %}


                            {% else %}

                                <option
                                    value='{{ default_etc_tag.id }}'>

                                    기타

                                </option>

                            {% endif %}


                        </select>

                    </div>


                <!-- 우선순위 -->

                <div>

                    <label
                        class="block text-xs font-semibold text-gray-500 mb-2">

                        우선순위

                    </label>


                    <div class="flex gap-4 text-sm">


                        <label
                            class="flex items-center gap-1.5 cursor-pointer">

                            <input
                                type="radio"
                                name="priority"
                                value="H"
                                id="someday-edit-priority-H"
                                class="accent-red-500">

                            <span class="text-red-500 font-bold">
                                높음(H)
                            </span>

                        </label>


                        <label
                            class="flex items-center gap-1.5 cursor-pointer">

                            <input
                                type="radio"
                                name="priority"
                                value="M"
                                id="someday-edit-priority-M"
                                class="accent-amber-500">

                            <span class="text-amber-500 font-bold">
                                보통(M)
                            </span>

                        </label>


                        <label
                            class="flex items-center gap-1.5 cursor-pointer">

                            <input
                                type="radio"
                                name="priority"
                                value="L"
                                id="someday-edit-priority-L"
                                class="accent-green-500">

                            <span class="text-green-500 font-bold">
                                낮음(L)
                            </span>

                        </label>


                    </div>

                </div>


            </div>


            <!-- 버튼 -->

            <div class="flex gap-2 mt-6">


                <button
                    type="button"
                    onclick="closeSomedayEditModal()"
                    class="flex-1 py-2 text-sm font-medium text-gray-500 bg-gray-100 rounded-lg hover:bg-gray-200 transition">

                    취소

                </button>


                <button
                    type="submit"
                    class="flex-1 py-2 text-sm font-medium text-white bg-black rounded-lg hover:bg-gray-800 transition">

                    저장

                </button>


            </div>


        </form>

    </div>

</div>
