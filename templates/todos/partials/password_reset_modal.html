<!-- password_reset_modal.html -->
<div
    id='passwordResetModal'
    class='
        fixed
        inset-0
        z-[9999]
        hidden
        items-center
        justify-center
        bg-black/45
        p-6
        backdrop-blur-sm
    '
    aria-hidden='true'
>

    <!-- 모달 -->

    <div
        class='
            relative
            w-full
            max-w-[430px]
            rounded-[22px]
            bg-white
            p-7
            shadow-2xl
            sm:p-8
        '
        role='dialog'
        aria-modal='true'
        aria-labelledby='passwordResetModalTitle'
    >


        <!-- ====================================================
             헤더
        ===================================================== -->

        <div
            class='
                mb-7
                flex
                items-center
                justify-between
            '
        >

            <div>

                <h2
                    id='passwordResetModalTitle'
                    class='
                        text-2xl
                        font-extrabold
                        tracking-tight
                        text-gray-900
                    '
                >
                    비밀번호 재설정
                </h2>

                <p
                    class='
                        mt-2
                        text-sm
                        leading-relaxed
                        text-gray-500
                    '
                >
                    가입한 이메일을 입력하면
                    비밀번호 재설정 링크를 보내드립니다.
                </p>

            </div>


            <!-- 닫기 -->

            <button
                type='button'
                onclick='closePasswordResetModal()'
                class='
                    flex
                    h-10
                    w-10
                    flex-shrink-0
                    items-center
                    justify-center
                    rounded-full
                    bg-gray-100
                    text-gray-600
                    transition
                    hover:bg-gray-200
                    active:scale-95
                '
                aria-label='비밀번호 재설정 모달 닫기'
            >

                <i
                    class='fa-solid fa-xmark text-lg'
                ></i>

            </button>

        </div>


        <!-- ====================================================
             이메일 입력 폼
        ===================================================== -->

        <form
            id='passwordResetForm'
        >


            <!-- 이메일 -->

            <div>

                <label
                    for='passwordResetEmail'
                    class='
                        mb-2
                        block
                        text-sm
                        font-bold
                        text-gray-800
                    '
                >
                    이메일 ID
                </label>


                <div
                    class='relative'
                >

                    <i
                        class='
                            fa-regular
                            fa-envelope
                            pointer-events-none
                            absolute
                            left-5
                            top-1/2
                            -translate-y-1/2
                            text-base
                            text-gray-400
                        '
                    ></i>


                    <input
                        type='email'
                        id='passwordResetEmail'
                        name='email'
                        placeholder='이메일을 입력하세요'
                        autocomplete='email'
                        required
                        class='
                            h-[58px]
                            w-full
                            rounded-xl
                            border
                            border-gray-200
                            bg-white
                            py-0
                            pl-12
                            pr-5
                            text-base
                            text-gray-900
                            outline-none
                            transition
                            placeholder:text-gray-400
                            focus:border-gray-900
                            focus:ring-4
                            focus:ring-black/5
                        '
                    >

                </div>


                <!-- 메시지 -->

                <p
                    id='passwordResetMessage'
                    class='
                        min-h-5
                        px-1
                        pt-2
                        text-sm
                    '
                ></p>

            </div>


            <!-- 재설정 버튼 -->

            <button
                type='submit'
                id='passwordResetSubmitButton'
                class='
                    mt-6
                    flex
                    h-[60px]
                    w-full
                    items-center
                    justify-center
                    gap-2
                    rounded-xl
                    bg-gray-900
                    text-lg
                    font-bold
                    text-white
                    transition
                    hover:bg-black
                    disabled:cursor-not-allowed
                    disabled:opacity-50
                    active:scale-[0.99]
                '
            >

                <i
                    class='fa-solid fa-paper-plane'
                ></i>

                재설정 링크 보내기

            </button>


            <!-- 로그인 -->

            <div
                class='
                    mt-6
                    flex
                    items-center
                    justify-center
                    gap-1
                    text-sm
                    text-gray-400
                '
            >

                <span>
                    비밀번호가 기억나셨나요?
                </span>


                <button
                    type='button'
                    onclick='closePasswordResetModal()'
                    class='
                        font-bold
                        text-gray-700
                        transition
                        hover:underline
                    '
                >
                    로그인
                </button>

            </div>

        </form>

    </div>

</div>
