{% load static %}

<!DOCTYPE html>

<html lang='ko'>

<head>

    <meta charset='UTF-8'>

    <meta
        name='viewport'
        content='width=device-width, initial-scale=1.0'
    >

    <title>비밀번호 재설정</title>


    <!-- Tailwind CSS -->

    <script src='https://cdn.tailwindcss.com'></script>


    <!-- Font Awesome -->

    <link
        rel='stylesheet'
        href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css'
    >


    <!-- Supabase JS -->

    <script
        src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'
    ></script>

</head>


<body
    class='
        min-h-screen
        bg-gray-100
        flex
        items-center
        justify-center
        px-5
        py-10
    '
>


    <!-- ============================================================
         비밀번호 재설정
    ============================================================= -->

    <main
        class='
            w-full
            max-w-[430px]
            rounded-3xl
            bg-white
            px-6
            py-8
            shadow-xl
            sm:px-8
        '
    >


        <!-- ========================================================
             아이콘
        ========================================================= -->

        <div
            class='
                mx-auto
                mb-6
                flex
                h-16
                w-16
                items-center
                justify-center
                rounded-full
                bg-gray-100
            '
        >

            <i
                class='
                    fa-solid
                    fa-lock
                    text-2xl
                    text-gray-700
                '
            ></i>

        </div>


        <!-- ========================================================
             제목
        ========================================================= -->

        <div
            class='
                mb-8
                text-center
            '
        >

            <h1
                class='
                    text-2xl
                    font-extrabold
                    tracking-tight
                    text-gray-900
                '
            >
                비밀번호 재설정
            </h1>


            <p
                class='
                    mt-3
                    text-sm
                    leading-6
                    text-gray-500
                '
            >
                새로운 비밀번호를 입력해주세요.
            </p>

        </div>


        <!-- ========================================================
             폼
        ========================================================= -->

        <form
            id='passwordResetConfirmForm'
            class='space-y-5'
        >


            <!-- ====================================================
                 새 비밀번호
            ===================================================== -->

            <div>

                <label
                    for='newPassword'
                    class='
                        mb-2
                        block
                        text-sm
                        font-bold
                        text-gray-800
                    '
                >
                    새 비밀번호
                </label>


                <div
                    class='
                        relative
                    '
                >

                    <i
                        class='
                            fa-solid
                            fa-lock
                            pointer-events-none
                            absolute
                            left-4
                            top-1/2
                            -translate-y-1/2
                            text-gray-400
                        '
                    ></i>


                    <input
                        type='password'
                        id='newPassword'
                        name='newPassword'
                        autocomplete='new-password'
                        placeholder='새 비밀번호를 입력하세요'
                        minlength='6'
                        required
                        class='
                            h-14
                            w-full
                            rounded-2xl
                            border
                            border-gray-200
                            bg-white
                            pl-11
                            pr-4
                            text-base
                            text-gray-900
                            outline-none
                            transition
                            focus:border-gray-900
                            focus:ring-4
                            focus:ring-gray-900/5
                        '
                    >

                </div>

            </div>


            <!-- ====================================================
                 새 비밀번호 확인
            ===================================================== -->

            <div>

                <label
                    for='newPasswordConfirm'
                    class='
                        mb-2
                        block
                        text-sm
                        font-bold
                        text-gray-800
                    '
                >
                    새 비밀번호 확인
                </label>


                <div
                    class='
                        relative
                    '
                >

                    <i
                        class='
                            fa-solid
                            fa-lock
                            pointer-events-none
                            absolute
                            left-4
                            top-1/2
                            -translate-y-1/2
                            text-gray-400
                        '
                    ></i>


                    <input
                        type='password'
                        id='newPasswordConfirm'
                        name='newPasswordConfirm'
                        autocomplete='new-password'
                        placeholder='새 비밀번호를 다시 입력하세요'
                        minlength='6'
                        required
                        class='
                            h-14
                            w-full
                            rounded-2xl
                            border
                            border-gray-200
                            bg-white
                            pl-11
                            pr-4
                            text-base
                            text-gray-900
                            outline-none
                            transition
                            focus:border-gray-900
                            focus:ring-4
                            focus:ring-gray-900/5
                        '
                    >

                </div>


                <p
                    id='passwordMatchMessage'
                    class='
                        mt-2
                        min-h-5
                        px-1
                        text-xs
                    '
                ></p>

            </div>


            <!-- ====================================================
                 결과 메시지
            ===================================================== -->

            <p
                id='passwordResetConfirmMessage'
                class='
                    min-h-5
                    text-center
                    text-sm
                '
            ></p>


            <!-- ====================================================
                 변경 버튼
            ===================================================== -->

            <button
                type='submit'
                id='passwordResetConfirmButton'
                class='
                    h-14
                    w-full
                    rounded-2xl
                    bg-black
                    text-base
                    font-extrabold
                    text-white
                    transition
                    hover:bg-gray-800
                    active:scale-[0.99]
                    disabled:cursor-not-allowed
                    disabled:opacity-50
                '
            >
                비밀번호 변경
            </button>


        </form>


        <!-- ========================================================
             안내
        ========================================================= -->

        <p
            class='
                mt-6
                text-center
                text-xs
                leading-5
                text-gray-400
            '
        >
            비밀번호 변경이 완료되면 다시 로그인해주세요.
        </p>


    </main>


    <!-- ============================================================
         Supabase 초기화
    ============================================================= -->

    <script>

        const supabaseUrl =
            '{{ SUPABASE_URL }}';

        const supabaseAnonKey =
            '{{ SUPABASE_ANON_KEY }}';


        const supabaseClient =
            window.supabase.createClient(
                supabaseUrl,
                supabaseAnonKey
            );

    </script>


    <!-- ============================================================
         비밀번호 재설정 확인 JS
    ============================================================= -->

    <script
        src='{% static 'todos/js/password_reset_confirm.js' %}'
    ></script>


</body>

</html>
