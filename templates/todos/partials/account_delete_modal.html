<div
    id='accountDeleteModal'
    class='fixed inset-0 z-[70] hidden bg-black/40 p-4 flex items-center justify-center'
>
    <div
        class='w-full max-w-md max-h-[90vh] overflow-y-auto bg-white rounded-2xl shadow-2xl p-6'
    >

        <!-- 헤더 -->
        <div class='flex items-start justify-between mb-5'>

            <div>
                <p class='text-[13px] text-red-500 font-bold mb-1'>
                    계정 관리
                </p>

                <h2 class='text-xl font-extrabold text-gray-900'>
                    회원 탈퇴
                </h2>
            </div>

            <button
                type='button'
                onclick='closeAccountDeleteModal()'
                class='w-9 h-9 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100'
            >
                <i class='fa-solid fa-xmark'></i>
            </button>

        </div>


        <!-- 경고 -->
        <div class='p-4 rounded-xl bg-red-50 border border-red-100 mb-5'>

            <p class='text-base font-bold text-red-600 mb-1'>
                탈퇴시 계정 이용 내역을 복구할 수 없습니다.
            </p>

            <p class='text-[14px] text-red-500 leading-relaxed'>
                탈퇴 사유는 최대 1년간 보관하여 서비스 개선을 위한
                소중한 의견으로 사용 후 삭제됩니다.
            </p>

        </div>


        <form
            id='withdrawalForm'
            method='POST'
            action="{% url 'account_delete' %}"
        >

            {% csrf_token %}


            <!-- 탈퇴 사유 -->
            <div class='mb-5'>

                <label
                    class='block text-sm font-bold text-gray-700 mb-2'
                >
                    탈퇴 사유 <span class='text-red-500'>*</span>
                </label>

                <select
                    id='withdrawalReason'
                    name='withdrawal_reason'
                    required
                    class='w-full px-3 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-black'
                >
                    <option value=''>
                        탈퇴 사유를 선택해주세요
                    </option>

                    <option value='NOT_NEEDED'>
                        서비스가 더 이상 필요하지 않음
                    </option>

                    <option value='INCONVENIENT'>
                        서비스 사용이 불편함
                    </option>

                    <option value='PRIVACY_SECURITY'>
                        개인정보 또는 보안 우려
                    </option>

                    <option value='OTHER'>
                        기타
                    </option>

                </select>

            </div>


            <!-- 상세 사유 -->
            <div class='mb-5'>

                <label
                    class='block text-sm font-bold text-gray-700 mb-2'
                >
                    상세 사유 <span class='text-red-500'>*</span>
                </label>

                <textarea
                    id='withdrawalDetail'
                    name='withdrawal_detail'
                    minlength='10'
                    maxlength='500'
                    required
                    rows='5'
                    placeholder='서비스를 이용하면서 불편하였던 점이나 개선점을 10자 이상 적어주세요.'
                    class='w-full px-3 py-3 border border-gray-200 rounded-xl text-sm resize-none focus:outline-none focus:border-black'
                ></textarea>

                <div class='flex justify-end mt-1'>

                    <span
                        id='withdrawalDetailCount'
                        class='text-[10px] text-gray-400'
                    >
                        0 / 500
                    </span>

                </div>

            </div>


            <!-- 복구 불가 확인 -->
            <div class='mb-5'>
                <label
                    class='flex items-start gap-2 cursor-pointer'
                >

                    <input
                        type='checkbox'
                        id='withdrawalConfirm'
                        name='withdrawal_confirm'
                        required
                        class='mt-0.5 accent-red-500'
                    >

                    <span
                        id='withdrawalConfirmText'
                        class='text-sm text-red-500 font-medium leading-relaxed'
                    >
                        계정, 데이터 등 이용 내역을 복구할 수 없음을
                        다시 한 번 확인하였습니다.
                    </span>

                </label>

            </div>


            <!-- 확인 문구 -->
            <div class='mb-6'>

                <label
                    class='block text-sm font-bold text-gray-700 mb-2'
                >
                    확인 문구 <span class='text-red-500'>*</span>
                </label>

                <p class='text-[13px] text-gray-500 leading-relaxed mb-2'>
                    아래 입력창에
                    <strong class='text-gray-900'>
                        {{ user.email }}
                    </strong>
                    을 정확히 입력해주세요.
                </p>

                <input
                    type='text'
                    id='withdrawalIdentity'
                    name='withdrawal_identity'
                    required
                    autocomplete='off'
                    data-expected-identity='{{ user.email }}'
                    class='w-full px-3 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-black'
                >

            </div>


            <!-- 버튼 -->
            <div class='flex gap-2'>

                <button
                    type='button'
                    onclick='closeAccountDeleteModal()'
                    class='flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 text-sm font-bold'
                >
                    취소
                </button>

                <button
                    type='submit'
                    id='withdrawalSubmitButton'
                    disabled
                    class='flex-1 py-3 rounded-xl bg-red-500 text-white text-sm font-bold disabled:opacity-40 disabled:cursor-not-allowed'
                >
                    회원 탈퇴
                </button>

            </div>

        </form>

    </div>
</div>
